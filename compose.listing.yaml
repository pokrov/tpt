name: classroom-listing-offline
services:
  listing:
    build:
      context: .
      dockerfile: Dockerfile.listing
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      LISTING_LIBRARY_DIR: /library
    volumes:
      - ./local-data/listing-previews:/app/local-data/listing-previews
      - ./local-data/output:/library:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
